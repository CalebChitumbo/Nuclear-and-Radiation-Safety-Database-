name: Deploy Firestore Rules

# Publish the security rules and indexes to Firebase whenever the production
# branch changes them. Firestore denies every write to a collection no deployed
# rule mentions, so a release that adds one (workPlanNotes, workPlanBaseline,
# dailyEntries, truckScans …) only works once this has run.
#
# Also runnable on demand: Actions → Deploy Firestore Rules → Run workflow.
#
# Uses the same FIREBASE_TOKEN repo secret as Deploy Functions. If it is not set
# yet: firebase login:ci → copy the token → GitHub repo Settings → Secrets and
# variables → Actions → New repository secret.

on:
  push:
    branches: ["claude/stoic-rubin-pqGb4"]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15
      - name: Deploy rules and indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project nrsd-imformation-management --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
