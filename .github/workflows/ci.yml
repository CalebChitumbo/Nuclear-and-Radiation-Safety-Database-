name: CI

# Continuous "debugger": type-checks, lints, tests and builds the app on every
# push and pull request, so regressions are caught before they reach Vercel.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build (Firebase mode — mirrors Vercel)
        run: npm run build
        env:
          # Left in Firebase mode exactly like Vercel. No Firebase secrets are
          # needed: the build never calls Firebase — all Firestore/Auth access
          # is client-side, behind the auth guard.
          NEXT_PUBLIC_USE_MOCK: ""
